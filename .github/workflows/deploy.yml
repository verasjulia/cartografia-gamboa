# Builds the site and publishes it on GitHub Pages at every push to `dev`.
# Needs, in the repository settings on GitHub:
# - Settings > Pages > Source: "GitHub Actions"
# - Settings > Secrets and variables > Actions: secret MAPBOX_TOKEN
name: Publicar no GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the Mapbox token
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          if [ -z "$VITE_MAPBOX_TOKEN" ]; then
            echo "::error::Secret MAPBOX_TOKEN não configurado (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - run: npm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
